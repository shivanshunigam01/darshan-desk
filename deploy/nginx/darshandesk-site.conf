# Marketing / download site — static landing + extension ZIP
server {
    listen 443 ssl http2;
    server_name darshandesk.example.com;

    # ssl_certificate     /etc/letsencrypt/live/darshandesk.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/darshandesk.example.com/privkey.pem;

    root /var/www/darshandesk;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        types { }
        default_type application/zip;
    }
}

server {
    listen 80;
    server_name darshandesk.example.com;
    return 301 https://$host$request_uri;
}
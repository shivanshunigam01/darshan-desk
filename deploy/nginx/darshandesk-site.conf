# Landing page + extension ZIP download
# Replace darshandesk.example.com, deploy static files to /var/www/darshandesk
# TLS: sudo certbot --nginx -d darshandesk.example.com

server {
    listen 80;
    server_name darshandesk.example.com;

    root /var/www/darshandesk;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        types { }
        default_type application/zip;
    }
}
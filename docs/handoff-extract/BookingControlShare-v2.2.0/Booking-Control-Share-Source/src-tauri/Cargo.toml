[package]
name = "booking-control-share"
version = "2.2.0"
description = "TTD browser orchestration desktop control panel"
authors = ["IFSCM"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

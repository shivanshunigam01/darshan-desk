[project]
name = "ttdapi"
version = "0.1.0"
description = "Concurrent worker-based automation API for the TTD booking portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "loguru>=0.7.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "cloakbrowser==0.6.3",
    "httpx[http2]>=0.27.0",
    "pillow>=12.3.0",
    "ddddocr>=1.6.1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
ttdapi = "app.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.wheel.force-include]
"src/zoom-extension" = "zoom-extension"
"src/app/services/ttd/razorpay_browser_helper_v2.js" = "app/services/ttd/razorpay_browser_helper_v2.js"

[tool.hatch.build]
include = [
    "src/app",
    "src/zoom-extension",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.10.0",
]

 
# --- Ruff Configuration ---
[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep this to ruff's conventional defaults (pyflakes + a slice of pycodestyle).
# Without this, some environments' ruff config falls back to enabling every
# rule set (including opinionated ones like flake8-datetimez), which isn't
# what we want enforced in CI.
select = ["E4", "E7", "E9", "F", "I"]

# --- Basedpyright Configuration ---
[tool.basedpyright]
typeCheckingMode = "basic" 
venvPath = "."
venv = ".venv"

reportOptionalMemberAccess = "none"

[tool.pytest.ini_options]
pythonpath = ["src"]
